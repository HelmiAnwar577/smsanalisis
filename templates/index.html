<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Defender — Analisis Risiko Penipuan SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Dynamic Background Animation -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  
  <div class="container">
    <header class="hero">
      <div class="badge">AI-Powered SMS Analysis</div>
      <h1 class="hero-title">SMS <span>Defender</span></h1>
      <p class="hero-subtitle">Sistem Deteksi Smishing (Naive Bayes + Skoring Risiko + Generative AI)</p>
    </header>

    {% if error %}
    <div class="alert-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="alert-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <div class="glass-panel">
      <form action="/analyze" method="POST" id="analyzeForm">
        
        <div class="form-group">
          <label for="sms_text" class="form-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            Paste Teks SMS
          </label>
          <textarea id="sms_text" name="sms_text" class="textarea-input" placeholder="Paste teks SMS yang mencurigakan di sini... (misal: 'Selamat, Anda mendapatkan hadiah dari...')"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Analisis Ancaman</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>
      </form>
    </div>

    <footer>
      SMS Defender v{{ version | default('6.1') }} · Naive Bayes Classifier + Skoring Risiko + Penjelasan Generative AI<br>
      © 2026 — Riset Deteksi Smishing
    </footer>
  </div>

  <script>
    document.getElementById('analyzeForm').addEventListener('submit', function(e) {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('sms_text').value;

      if (!text.trim()) {
        e.preventDefault();
        alert("Harap masukkan teks SMS.");
        return;
      }

      btn.classList.add('loading');
      btn.querySelector('span').innerText = "Memproses Analisis...";
      btn.style.pointerEvents = "none";
    });
  </script>
</body>
</html>
